<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-приложение: заглушка</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; line-height: 1.5; color: #1a1a1a; background: #fff; }
    main { max-width: 480px; margin: 0 auto; }
    code { background: #f2f2f2; padding: 2px 4px; border-radius: 4px; }
    .ok { color: #1a7f37; } .fail { color: #b42318; }
    @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } code { background: #222; } }
  </style>
</head>
<body>
<main>
  <h1>Мини-приложение появится в шаге 0.4</h1>
  <p>Это временная страница. Она нужна, чтобы проверить, что веб-сервер и API работают вместе.</p>
  <p>Состояние API: <span id="status">проверяю…</span></p>
  <p>Проверить вручную: <code>/api/v1/healthz</code>, <code>/api/v1/readyz</code>.</p>
</main>
<script>
  fetch('/api/v1/readyz')
    .then(function (r) { return r.ok ? ['работает, база доступна', 'ok'] : ['недоступно (' + r.status + ')', 'fail']; })
    .catch(function () { return ['недоступно', 'fail']; })
    .then(function (res) {
      var el = document.getElementById('status');
      el.textContent = res[0];
      el.className = res[1];
    });
</script>
</body>
</html>
